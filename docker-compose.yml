name: yakutia-holidays

services:
  directus:
    image: directus/directus:11.3.5
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    volumes:
      - ./directus/uploads:/directus/uploads
      - ./directus/database:/directus/database
    environment:
      KEY: ${DIRECTUS_KEY:-yakutia-random-key-change-me}
      SECRET: ${DIRECTUS_SECRET:-yakutia-super-secret-key-change-me}
      PUBLIC_URL: ${PUBLIC_DIRECTUS_URL:-http://localhost:8055}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yakutia.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      CORS_ENABLED: "true"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173,http://localhost}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/health > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_DIRECTUS_URL: ${VITE_DIRECTUS_URL:-http://localhost:8055}
        VITE_SMARTCAPTCHA_CLIENT_KEY: ${VITE_SMARTCAPTCHA_CLIENT_KEY:-}
        VITE_SMARTCAPTCHA_TEST: ${VITE_SMARTCAPTCHA_TEST:-false}
    ports:
      - "${WEB_PORT:-8080}:5000"
      - "${API_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVE_STATIC: "true"
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      DIRECTUS_STATIC_TOKEN: ${DIRECTUS_STATIC_TOKEN:-yakutia-docker-api-token}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yakutia.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080,http://localhost:5173}
      PUBLIC_DIRECTUS_URL: ${PUBLIC_DIRECTUS_URL:-http://localhost:8055}
      SUBMIT_RATE_LIMIT_MAX: ${SUBMIT_RATE_LIMIT_MAX:-0}
      UPLOAD_RATE_LIMIT_MAX: ${UPLOAD_RATE_LIMIT_MAX:-0}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
    volumes:
      - api-data:/data
    depends_on:
      directus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
